[package]
name = "daily-plan"
version = "0.1.0"
description = "Daily Plan — quick capture of tasks for the day"
edition = "2021"

[lib]
name = "daily_plan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
